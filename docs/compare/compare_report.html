<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5, user-scalable=yes">
  <title>Robot Framework Test Report</title>
  <link rel="icon" type="image/svg+xml" href="https://docs.robotframework.org/img/robot-framework-dark.svg">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* ========== CSS Reset & Base ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    /* ========== CSS Variables (Dark Theme Default) ========== */
    :root {
      --background: hsl(220, 16%, 10%);
      --foreground: hsl(220, 10%, 92%);
      --card: hsl(220, 16%, 12%);
      --card-foreground: hsl(220, 10%, 92%);
      --popover: hsl(220, 16%, 14%);
      --primary: hsl(220, 14%, 75%);
      --primary-foreground: hsl(220, 16%, 10%);
      --secondary: hsl(220, 14%, 18%);
      --secondary-foreground: hsl(220, 10%, 75%);
      --muted: hsl(220, 14%, 16%);
      --muted-foreground: hsl(220, 10%, 55%);
      --accent: hsl(220, 14%, 20%);
      --border: hsl(220, 14%, 20%);
      --sidebar: hsl(220, 16%, 8%);
      --sidebar-foreground: hsl(220, 10%, 85%);
      
      /* Status Colors */
      --status-pass: hsl(142deg 81.68% 25.4%);
      --status-pass-fg: hsl(142, 52%, 95%);
      --status-pass-muted: hsl(142, 40%, 18%);
      --status-fail: hsl(0, 65%, 55%);
      --status-fail-fg: hsl(0, 65%, 98%);
      --status-fail-muted: hsl(0, 50%, 18%);
      --status-skip: hsl(45, 70%, 50%);
      --status-skip-fg: hsl(45, 70%, 10%);
      --status-skip-muted: hsl(45, 50%, 18%);
      
      /* Log Colors */
      --log-info: hsl(210, 60%, 55%);
      --log-warn: hsl(38, 90%, 55%);
      --log-error: hsl(0, 75%, 60%);
      --log-debug: hsl(220, 10%, 50%);
      
      --radius: 6px;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --font-sans: ui-sans-serif, system-ui, -apple-system, sans-serif;

      /* Reserved Keyword Badge*/
      --badge-bg: hsl(33.67deg 100% 50.3% / 30%);
      --text-color: #ea7e00;
    }
    /* Light Theme */
    .light {
      --background: hsl(220, 20%, 97%);
      --foreground: hsl(220, 16%, 12%);
      --card: hsl(0, 0%, 100%);
      --card-foreground: hsl(220, 16%, 12%);
      --muted: hsl(220, 14%, 92%);
      --muted-foreground: hsl(220, 10%, 45%);
      --accent: hsl(220, 14%, 90%);
      --border: hsl(220, 14%, 88%);
      --sidebar: hsl(220, 20%, 95%);
      --sidebar-foreground: hsl(220, 16%, 20%);
      --status-pass: hsl(142, 60%, 30%);
      --status-pass-muted: hsl(142, 45%, 92%);
      --status-fail: hsl(0, 72%, 50%);
      --status-fail-muted: hsl(0, 55%, 95%);
      --status-skip: hsl(45, 80%, 42%);
      --status-skip-muted: hsl(45, 60%, 92%);


       /* Reserved Keyword Badge*/
      --badge-bg: hsl(33.67deg 100% 50.3% / 30%);
      --text-color: #ea7e00;
    }
    /* ========== Base Styles ========== */
    html, body {
      height: 100%;
      min-height: 100%;
      overflow: auto;
      font-family: var(--font-sans);
      background: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: hsl(220, 14%, 14%);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: hsl(220, 10%, 22%);
    }
    .light ::-webkit-scrollbar-thumb {
      background: hsl(220, 10%, 65%);
    }
    .light ::-webkit-scrollbar-thumb:hover {
      background: hsl(220, 10%, 50%);
    }
    .light .panel-header,
    .light .test-tree-bar {
      background: hsl(220, 14%, 86%);
    }
    /* ========== File Protocol Warning ========== */
    .warning-banner {
      padding: 16px 20px;
      background: var(--status-skip-muted);
      border-bottom: 1px solid var(--border);
      color: var(--foreground);
    }
    .warning-banner-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--status-skip);
    }
    .warning-banner-text {
      font-size: 12px;
      color: var(--foreground);
      line-height: 1.5;
    }
    .warning-list {
      margin: 8px 0 10px 20px;
      display: grid;
      gap: 6px;
      font-size: 12px;
    }
    .warning-code {
      display: inline-flex;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--muted);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      margin-left: 6px;
    }
    .warning-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .warning-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--foreground);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .warning-links {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      font-size: 12px;
    }
    .warning-links a {
      color: hsl(45, 100%, 65%);
      text-decoration: underline;
    }
    .warning-links a:hover {
      color: hsl(45, 100%, 72%);
    }
    .warning-banner a {
      color: hsl(45, 100%, 65%);
      text-decoration: underline;
    }
    .warning-banner a:hover {
      color: hsl(45, 100%, 72%);
    }
    /* ========== Layout ========== */
    .app {
      display: flex;
      flex-direction: column;
      min-width: 1024px;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }
    /* ========== Header ========== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .project-badge {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .light .project-badge {
      filter: invert(1);
    }
    .project-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .project-info h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      margin: 0;
    }
    .project-info p {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted-foreground);
      line-height: 1.2;
      margin: 0;
    }
    .header-center {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
    }
    .stat-total {
      color: var(--muted-foreground);
    }
    .stat-total strong {
      color: var(--foreground);
    }
    .stat-pass { color: var(--status-pass); display: flex; align-items: center; gap: 4px; }
    .stat-fail { color: var(--status-fail); display: flex; align-items: center; gap: 4px; }
    .stat-skip { color: var(--status-skip); display: flex; align-items: center; gap: 4px; }
    .divider {
      width: 1px;
      height: 16px;
      background: var(--border);
    }
    .pass-rate {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pass-rate-bar {
      width: 96px;
      height: 6px;
      background: var(--muted);
      border-radius: 3px;
      overflow: hidden;
    }
    .pass-rate-fill {
      height: 100%;
      background: var(--status-pass);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .pass-rate-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .time-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .time-info span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      border-radius: var(--radius);
      color: var(--foreground);
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-icon:hover {
      background: var(--accent);
    }
    /* ========== Status Badge ========== */
    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      text-align: center;
    }
    .status-badge.pass { background: var(--status-pass); color: var(--status-pass-fg); }
    .status-badge.fail { background: var(--status-fail); color: var(--status-fail-fg); }
    .status-badge.skip { background: var(--status-skip); color: var(--status-skip-fg); }
    .status-badge.sm { padding: 2px 6px; font-size: 11px; }
    .status-badge.lg { padding: 4px 10px; font-size: 13px; }
    .header .status-badge.lg {
      padding: 2px 8px;
      font-size: 11px;
      gap: 3px;
    }
    .header .status-badge.lg svg {
      width: 14px;
      height: 14px;
    }
    /* ========== Main Content ========== */
    .main-content {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 0;
    }
    /* ========== Sidebar ========== */
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 320px;
      min-width: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      transition: width 0.2s ease;
      overflow: hidden;
    }
    .sidebar.resizing {
      transition: none;
    }
    .sidebar.collapsed {
      width: 0;
    }
    .sidebar > .search-filter,
    .sidebar > .triage-panel,
    .sidebar > .test-tree-bar,
    .sidebar > .test-tree-hint {
      flex-shrink: 0;
    }
    .sidebar-toggle {
      position: absolute;
      left: 320px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 var(--radius) var(--radius) 0;
      cursor: pointer;
      transition: left 0.2s ease, background 0.15s;
      color: var(--muted-foreground);
    }
    .light .sidebar-toggle {
      color: var(--foreground);
    }
    .sidebar-toggle:hover {
      background: var(--accent);
    }
    .sidebar.collapsed + .sidebar-toggle {
      left: 0;
    }
    .sidebar-toggle.resizing {
      transition: none;
    }
    /* Resize handle between sidebar and main */
    .resize-handle {
      flex-shrink: 0;
      width: 1px;
      cursor: col-resize;
      background: transparent;
      transition: background 0.15s;
    }
    .resize-handle:hover,
    .resize-handle.resizing {
      background: var(--border);
    }
    .resize-handle:active {
      background: var(--primary);
    }
    /* ========== Search & Filters ========== */
    .search-filter {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      position: relative;
      margin-bottom: 8px;
    }
    .search-input input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--foreground);
      outline: none;
    }
    .search-input input::placeholder {
      color: var(--muted-foreground);
    }
    .search-input input:focus {
      border-color: var(--primary);
    }
    .search-input svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-foreground);
    }
    .filter-row {
      display: flex;
      gap: 8px;
    }
    .filter-select {
      flex: 1;
      padding: 6px 10px;
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--foreground);
      cursor: pointer;
      outline: none;
    }
    .filter-select:focus {
      border-color: var(--primary);
    }
    /* ========== Failed Tests Summary ========== */
    .failed-summary {
      border-bottom: 1px solid var(--border);
    }
    .failed-summary-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--status-fail);
      border: none;
      width: 100%;
      text-align: left;
    }
    .failed-summary-header:hover {
      background: var(--accent);
    }
    .failed-summary-list {
      max-height: 160px;
      overflow-y: auto;
    }
    .failed-summary-more {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-top: 1px solid var(--border);
      background: transparent;
      color: var(--primary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }
    .failed-summary-more:hover { background: var(--accent); }
    .failed-item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .failed-item:hover {
      background: var(--accent);
    }
    .failed-item.selected {
      background: var(--accent);
    }
    /* ========== Triage panel (warnings / failed / insights) ========== */
    .triage-panel {
      border-bottom: 1px solid var(--border);
      background: hsla(220, 14%, 14%, 0.55);
    }
    .light .triage-panel { background: hsla(220, 20%, 96%, 0.9); }
    .triage-header {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--foreground);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .triage-header:hover { background: var(--accent); }
    .triage-header-label { flex-shrink: 0; }
    .triage-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-left: auto;
      justify-content: flex-end;
    }
    .triage-chip {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--muted);
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }
    .triage-chip.fail { background: var(--status-fail-muted); color: var(--status-fail); }
    .triage-chip.warn { background: var(--status-skip-muted); color: var(--status-skip); }
    .triage-body {
      max-height: min(36vh, 260px);
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }
    /* ========== Duration Insights ========== */
    .insights-panel {
      border-bottom: 1px solid var(--border);
    }
    .insights-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--foreground);
      border: none;
      width: 100%;
      text-align: left;
    }
    .insights-header:hover { background: var(--accent); }
    .insights-body { padding: 8px 12px 12px; max-height: 180px; overflow-y: auto; }
    .insights-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted-foreground);
      margin: 8px 0 6px;
    }
    .insights-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      padding: 3px 0;
      cursor: pointer;
    }
    .insights-row:hover { color: var(--primary); }
    .insights-row .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .insights-row .name-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .insights-row .name-suite {
      font-size: 10px;
      color: var(--muted-foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .insights-row .dur { flex-shrink: 0; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    .histogram { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    .histogram-row { display: grid; grid-template-columns: 72px 1fr 36px; gap: 6px; align-items: center; font-size: 11px; color: var(--muted-foreground); }
    .histogram-bar-track { height: 8px; background: var(--muted); border-radius: 2px; overflow: hidden; }
    .histogram-bar-fill { height: 100%; background: var(--primary); border-radius: 2px; min-width: 0; }
    /* ========== Attempt history ========== */
    .attempts-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--muted);
    }
    .attempt-chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
    }
    .attempt-chip.pass { border-color: var(--status-pass); color: var(--status-pass); }
    .attempt-chip.fail { border-color: var(--status-fail); color: var(--status-fail); }
    .attempt-chip.skip { border-color: var(--status-skip); color: var(--status-skip); }
    /* ========== Compare mode ========== */
    .compare-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--background);
    }
    .compare-top {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }
    .compare-top-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .compare-top-brand img { width: 28px; height: 28px; }
    .compare-top-titles { min-width: 0; }
    .compare-top-titles h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .compare-top-titles p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted-foreground);
    }
    .compare-runs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .compare-run-pill {
      padding: 3px 8px;
      border-radius: var(--radius);
      background: var(--muted);
      color: var(--foreground);
      font-weight: 500;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .compare-run-arrow { color: var(--muted-foreground); }
    .compare-top-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: auto;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .compare-top-stats .fail { color: var(--status-fail); font-weight: 600; }
    .compare-top-stats .pass { color: var(--status-pass); font-weight: 600; }
    .compare-top-stats .muted { color: var(--muted-foreground); }
    .compare-health {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: stretch;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--muted);
      flex-shrink: 0;
    }
    .compare-health-run {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .compare-health-run .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted-foreground);
    }
    .compare-health-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .compare-health-metrics .m { color: var(--foreground); }
    .compare-health-metrics .m strong { font-weight: 600; }
    .compare-health-metrics .fail { color: var(--status-fail); }
    .compare-health-metrics .pass { color: var(--status-pass); }
    .compare-health-verdict {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      min-width: 160px;
      text-align: center;
    }
    .compare-health-verdict .badge {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .compare-health-verdict.worse .badge { color: var(--status-fail); }

    .compare-nav {

    .compare-nav-btn {
      display: flex;
      align-items: center;

      gap: 8px;
      width: 100%;
      padding: 7px 10px;

    .compare-nav-btn:hover { background: var(--accent); color: var(--foreground); }

    .compare-nav-btn .count {

    }
    .compare-nav-btn.active .count { color: var(--foreground); }
    .compare-nav-btn.has-fail .count { color: var(--status-fail); }
    .compare-nav-btn.has-pass .count { color: var(--status-pass); }
    .compare-nav-btn.is-empty { opacity: 0.45; }
    .compare-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .compare-list-empty {

      font-size: 12px;

    .compare-item {

    .compare-item-meta {

      align-items: center;

      flex-wrap: wrap;
    }
    .compare-item-meta .st-a,
    .compare-item-meta .st-b { font-weight: 600; }
    .compare-item-meta .st-a.pass,
    .compare-item-meta .st-b.pass { color: var(--status-pass); }
    .compare-item-meta .st-a.fail,
    .compare-item-meta .st-b.fail { color: var(--status-fail); }
    .compare-item-meta .st-a.skip,
    .compare-item-meta .st-b.skip { color: var(--status-skip); }
    .compare-main {
      overflow-y: auto;
      padding: 28px 32px;
      min-width: 0;
    }
    .compare-detail-head { margin-bottom: 24px; }
    .compare-detail-head h2 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .compare-detail-path {
      margin: 0;
      font-size: 12px;
      color: var(--muted-foreground);
      font-family: var(--font-mono);
    }
    .compare-transition {
      display: flex;
      align-items: center;

      flex-wrap: wrap;

      padding: 14px 16px;

    .compare-status-pill {

    .compare-transition-arrow {

    .compare-delta.flat { color: var(--muted-foreground); }
    .compare-split {

    .compare-side-label {

    .failed-item-name {

    /* ========== Test Tree ========== */
    .test-tree-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;

      background: var(--accent);
      color: var(--foreground);
    }
    .test-tree-hint {

      font-size: 11px;
      color: var(--muted-foreground);

    }

      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      color: var(--muted-foreground);

      display: flex;
      align-items: center;
      margin-right: 4px;
    }
    .tree-icon.pass { color: var(--status-pass); }
    .tree-icon.fail { color: var(--status-fail); }
    .tree-icon.skip { color: var(--status-skip); }
    .tree-name {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tree-node-header .tree-duration {
      flex-shrink: 0;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted-foreground);
    }
    .tree-name.suite {

    }
    .tree-loading {

      align-items: center;

    .tree-stats {

      gap: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      opacity: 0;
      transition: opacity 0.15s;

    .tree-stats .pass { color: var(--status-pass); }
    .tree-stats .fail { color: var(--status-fail); }
    .tree-stats .skip { color: var(--status-skip); }
    .tree-children {

      border-left: 1px solid var(--border);
      margin-left: 8px;

    .suite-setup-block,

    .suite-keyword-row {

      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      font-size: 12px;
      font-family: var(--font-mono);

    .suite-keyword-row.clickable { cursor: pointer; }
    .suite-keyword-row.clickable:hover { background: var(--accent); }
    .suite-keyword-row.clickable.selected { background: var(--accent); }
    /* ========== Main Panel ========== */
    .main-panel {
      flex: 1;
      min-width: 0;
      background: var(--background);
      display: flex;
      flex-direction: column;
    }
    /* ========== Empty State ========== */

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted-foreground);

      padding: 32px;

      height: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    .empty-state h3 {
      font-size: 16px;
      font-weight: 500;
      color: var(--foreground);
      margin-bottom: 8px;

    .empty-state p {
      font-size: 13px;
    }
    /* ========== Test Detail ========== */
    .test-detail {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .test-header {
      padding: 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);

      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;

      font-size: 18px;
      font-weight: 600;
      color: var(--foreground);

      font-size: 13px;
      color: var(--muted-foreground);
      margin-top: 4px;

      gap: 16px;
      font-size: 13px;
      color: var(--muted-foreground);

      align-items: center;
      gap: 4px;
    }
    .test-tags {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      background: var(--muted);
      border-radius: 4px;
      font-size: 11px;
      color: var(--muted-foreground);
      text-align: center;
    }
    /* ========== Failure Banner ========== */
    .failure-banner {
      padding: 12px 8px 12px 16px;

      justify-content: space-between;
      margin-bottom: 6px;

    .failure-header span {

      font-size: 13px;
      font-weight: 500;
      color: var(--status-fail);

    .btn-copy {

      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: transparent;
      border: none;
      border-radius: var(--radius);

      color: var(--muted-foreground);
      cursor: pointer;

    }
    .failure-message {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--foreground);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 160px;
      overflow-y: auto;
    }
    .suite-warnings-banner {
      padding: 12px 8px 12px 16px;
      background: var(--status-skip-muted);
      border-bottom: 1px solid var(--border);
      max-height: 220px;
      overflow-y: auto;
    }
    .suite-warnings-content {
      min-width: 0;

    function renderKeywordTree(keywords, depth = 0) {

        const isExpanded = state.expandedKeywords.has(kw.id);

        const hasChildren = children.length > 0;
        const hasErrorLog = keywordHasErrorLog(kw);
        return `

            <div class="keyword-header ${state.selectedKeyword?.id === kw.id ? "selected" : ""}" data-keyword-id="${kw.id}" title="${((kw.badge ? kw.badge + " " : "") + (kw.name || "")).replace(/"/g, "&quot;")}">

              <span class="tree-icon ${getStatusClass(kw.status)}">${getStatusIcon(kw.status)}</span>
              ${hasErrorLog ? `<span class="keyword-error-indicator" title="Contains ERROR-level log">${icons.alert}</span>` : ""}

              ${kw.returned ? `<span class="keyword-returned" title="Returns: ${(kw.returnValues || []).map(v => (v || "").replace(/"/g, "&quot;")).join(", ") || "value(s)"}">RETURNS</span>` : ""}

              <span class="keyword-duration">${formatDuration(kw.duration)}</span>

      });
      // Triage panel toggle
      document.getElementById("toggle-triage")?.addEventListener("click", () => {
        state.triageOpen = !state.triageOpen;
        render();
      });
      // Failed summary toggle
      document.getElementById("toggle-failed")?.addEventListener("click", () => {
        state.failedSummaryOpen = !state.failedSummaryOpen;
        render();
      });
      document.getElementById("failed-show-more")?.addEventListener("click", () => {
        state.failedShowLimit = Math.min(
          getFailedTests(reportData.rootSuite).length,
          state.failedShowLimit + FAILED_LIST_PAGE
        );
        render();
      });
      document.getElementById("failed-show-less")?.addEventListener("click", () => {
        state.failedShowLimit = FAILED_LIST_PAGE;
        render();
      });
      // Warnings / errors summary toggle
      document.getElementById("toggle-errors")?.addEventListener("click", () => {
        state.errorsOpen = !state.errorsOpen;
        render();
      });
      // Duration insights toggle
      document.getElementById("toggle-insights")?.addEventListener("click", () => {
        state.insightsOpen = !state.insightsOpen;
        render();
      });
      document.querySelectorAll("[data-insight-test-id]").forEach(el => {
        el.addEventListener("click", async () => {
          const testId = el.getAttribute("data-insight-test-id");
          if (!testId || !reportData?.rootSuite) return;
          state.selectedSuiteKeyword = null;
          state.selectedKeyword = null;
          state.logsCleared = false;
          if (externalData) {
            const suiteId = dataStore.testToSuite.get(testId);
            if (suiteId) {
              const path = getSuitePathToId(reportData.rootSuite, suiteId);
              if (path) path.forEach(id => state.expandedSuites.add(id));
              await ensureSuiteLoaded(suiteId);
            }
            state.selectedTest = await ensureTestLoaded(testId);
          } else {
            state.selectedTest = getAllTests(reportData.rootSuite).find(t => t.id === testId) || null;
            const path = getSuitePathToTest(reportData.rootSuite, testId);
            if (path) path.forEach(id => state.expandedSuites.add(id));
          }
          if (state.selectedTest) location.hash = "test=" + state.selectedTest.id;
          render();
        });
      });
      // Compare mode
      document.querySelectorAll("[data-compare-filter]").forEach(el => {
        el.addEventListener("click", () => {
          state.compareFilter = el.getAttribute("data-compare-filter") || "newly_failing";
          state.compareSuiteCollapseInitialized = false;
          state.compareCollapsedSuites = new Set();
          const list = getCompareList();
          state.compareSelected = list[0] || null;
          render();
        });
      });
      document.getElementById("view-blockers")?.addEventListener("click", () => {
        state.compareFilter = "newly_failing";
        state.compareSearch = "";
        state.compareTagFilter = "";
        state.compareSuiteCollapseInitialized = false;
        state.compareCollapsedSuites = new Set();
        const list = getCompareList();
        state.compareSelected = list[0] || null;
        render();
      });
      document.querySelectorAll("[data-compare-suite]").forEach(el => {
        el.addEventListener("click", () => {
          const path = el.getAttribute("data-compare-suite") || "";
          if (!path) return;
          if (state.compareCollapsedSuites.has(path)) state.compareCollapsedSuites.delete(path);
          else state.compareCollapsedSuites.add(path);
          render();
        });
      });
      document.getElementById("compare-expand-suites")?.addEventListener("click", () => {
        const list = getCompareList();
        const groups = groupCompareListBySuite(list);
        const allCollapsed = groups.every(([path]) => state.compareCollapsedSuites.has(path));
        if (allCollapsed || state.compareCollapsedSuites.size) {
          state.compareCollapsedSuites = new Set();
        } else {
          state.compareCollapsedSuites = new Set(groups.map(([path]) => path));
        }
        state.compareSuiteCollapseInitialized = true;
        render();
      });
      document.getElementById("compare-search")?.addEventListener("input", (e) => {
        state.compareSearch = e.target.value || "";
        state.compareSuiteCollapseInitialized = false;
        const list = getCompareList();
        if (!list.some(x => compareEntryKey(x) === compareEntryKey(state.compareSelected))) {
          state.compareSelected = list[0] || null;
        }
        render();
        const input = document.getElementById("compare-search");
        if (input) {
          input.focus();
          input.setSelectionRange(state.compareSearch.length, state.compareSearch.length);
        }
      });
      document.getElementById("compare-tag-filter")?.addEventListener("change", (e) => {
        state.compareTagFilter = e.target.value || "";
        state.compareSuiteCollapseInitialized = false;
        const list = getCompareList();
        state.compareSelected = list.find(x => compareEntryKey(x) === compareEntryKey(state.compareSelected)) || list[0] || null;
        render();
      });
      document.getElementById("compare-duration-min")?.addEventListener("change", (e) => {
        const n = parseInt(e.target.value, 10);
        state.compareDurationMinMs = Number.isFinite(n) && n >= 0 ? n : 100;
        state.compareSuiteCollapseInitialized = false;
        const list = getCompareList();
        state.compareSelected = list.find(x => compareEntryKey(x) === compareEntryKey(state.compareSelected)) || list[0] || null;
        render();
      });
      document.getElementById("copy-blockers")?.addEventListener("click", async () => {
        const blockers = reportData.newlyFailing || reportData.blockers || [];
        const text = blockers.map(b => {
          const msg = (b.messageB || "").replace(/\s+/g, " ").trim();
          return `- ${b.name || b.fullName}${msg ? `: ${msg}` : ""}`;
        }).join("\n");
        try {
          await navigator.clipboard.writeText(text || "(no blockers)");
          const btn = document.getElementById("copy-blockers");
          if (btn) {
            const prev = btn.innerHTML;
            btn.textContent = "Copied";
            setTimeout(() => { btn.innerHTML = prev; }, 1200);
          }
        } catch (_) {}
      });
      document.querySelectorAll(".compare-item, .compare-blocker-chip").forEach(el => {
        el.addEventListener("click", () => {
          const key = el.getAttribute("data-compare-key");
          if (el.classList.contains("compare-blocker-chip")) {
            state.compareFilter = "newly_failing";
            state.compareSearch = "";
            state.compareTagFilter = "";
            state.compareSuiteCollapseInitialized = false;
          }
          const list = getCompareList();
          const fromAll = (reportData.allComparisons || []).find(x => compareEntryKey(x) === key);
          state.compareSelected = list.find(x => compareEntryKey(x) === key) || fromAll || null;
          render();
        });
      });
      // Failed item clicks
      document.querySelectorAll(".failed-item").forEach(el => {
        el.addEventListener("click", async () => {
          const testId = el.dataset.testId;
          state.selectedSuiteKeyword = null;
          state.selectedKeyword = null;
          state.logsCleared = false;
          if (externalData) {
            const suiteId = dataStore.testToSuite.get(testId);
            if (suiteId) await ensureSuiteLoaded(suiteId);
            const loaded = await ensureTestLoaded(testId);
            state.selectedTest = loaded || { id: testId, name: "Test", status: "FAIL", tags: [], duration: 0, message: "", documentation: "", suiteErrors: [] };
          } else {
            state.selectedTest = getAllTests(reportData.rootSuite).find(t => t.id === testId);
          }
          if (state.selectedTest) {
            location.hash = "test=" + state.selectedTest.id;
            if (externalData && !state.selectedTest.logsLoaded) {
              ensureTestLogsLoaded(state.selectedTest).catch(() => {});
            }
            const kws = Array.isArray(state.selectedTest.keywords) ? state.selectedTest.keywords : [];
            if (kws.length === 1 && Array.isArray(kws[0].keywords) && kws[0].keywords.length > 0) {
              state.expandedKeywords.add(kws[0].id);
            }
          }
          render();
        });
      });
      document.querySelectorAll("[data-action='retry-summary']").forEach(el => {
        el.addEventListener("click", async () => {
          await loadExternalData();
          if (reportData?.rootSuite) initializeExpandedSuites(reportData.rootSuite);
          render();
        });
      });
      document.querySelectorAll("[data-action='retry-suite']").forEach(el => {
        el.addEventListener("click", async () => {
          const suiteId = el.dataset.suiteId;
          if (suiteId) await ensureSuiteLoaded(suiteId);
        });
      });
      document.querySelectorAll("[data-action='retry-test']").forEach(el => {
        el.addEventListener("click", async () => {
          const testId = el.dataset.testId;
          if (!testId) return;
          const suiteId = dataStore.testToSuite.get(testId);
          if (suiteId) await ensureSuiteLoaded(suiteId);
          const loaded = await ensureTestLoaded(testId);
          if (loaded) {
            state.selectedTest = loaded;
            render();
          }
        });
      });
      // Suite clicks (toggle expand)
      document.querySelectorAll(".tree-node-header[data-suite-id]").forEach(el => {
        el.addEventListener("click", async () => {
          const suiteId = el.dataset.suiteId;
          if (state.expandedSuites.has(suiteId)) {
            state.expandedSuites.delete(suiteId);
            render();
            return;
          }
          state.expandedSuites.add(suiteId);
          if (externalData) {
            await ensureSuiteLoaded(suiteId);
            const suite = dataStore.suiteMap.get(suiteId);
            if (suite) prefetchTestForSuite(suite);
          }
          render();
        });
      });
      // Test clicks
      document.querySelectorAll("[data-test-id]").forEach(el => {
        el.addEventListener("click", async (e) => {
          e.stopPropagation();
          const testId = el.dataset.testId;
          state.selectedSuiteKeyword = null;
          state.selectedKeyword = null;
          state.logsCleared = false;
          if (externalData) {
            const suiteId = dataStore.testToSuite.get(testId);
            if (suiteId) await ensureSuiteLoaded(suiteId);
            const loaded = await ensureTestLoaded(testId);
            state.selectedTest = loaded || null;
          } else {
            state.selectedTest = getAllTests(reportData.rootSuite).find(t => t.id === testId);
          }
          if (state.selectedTest) {
            location.hash = "test=" + state.selectedTest.id;
            const kws = Array.isArray(state.selectedTest.keywords) ? state.selectedTest.keywords : [];
            if (kws.length === 1 && Array.isArray(kws[0].keywords) && kws[0].keywords.length > 0) {
              state.expandedKeywords.add(kws[0].id);
            }
          }
          render();
        });
      });
      document.querySelectorAll(".suite-keyword-row.clickable").forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const suiteId = el.dataset.suiteId;
          const type = el.dataset.keywordType;
          const suite = getSuiteById(reportData.rootSuite, suiteId);
          if (!suite || (type !== "setup" && type !== "teardown")) return;
          const keyword = type === "setup" ? suite.setup : suite.teardown;
          if (!keyword) return;
          state.selectedSuiteKeyword = { suite, keyword, type };
          state.selectedKeyword = null;
          state.logsCleared = false;
          state.expandedKeywords.add(keyword.id);
          render();
        });
      });
      // Keyword clicks
      document.querySelectorAll("[data-keyword-id]").forEach(el => {
        el.addEventListener("click", (e) => {
          // Don't intercept clicks on images/links inside HTML log messages
          if (e.target.closest(".log-message") && (e.target.tagName === "IMG" || e.target.tagName === "A" || e.target.closest("a"))) return;
          const keywordId = el.dataset.keywordId;
          const findKeyword = (keywords) => {
            for (const kw of keywords) {
              if (kw.id === keywordId) return kw;
              if (kw.keywords) {
                const found = findKeyword(kw.keywords);
                if (found) return found;
              }
            }
            return null;
          };
          
          const keywordsInOrder = getCurrentKeywordsInOrder();
          const kw = findKeyword(keywordsInOrder);
          if (kw) {
            if (state.selectedKeyword?.id === kw.id) {
              // Toggle expand if already selected
              if (state.expandedKeywords.has(kw.id)) {
                state.expandedKeywords.delete(kw.id);
              } else {
                state.expandedKeywords.add(kw.id);
              }
            } else {
              state.selectedKeyword = kw;
              state.logsCleared = false;
              state.expandedKeywords.add(kw.id);
              if (state.logLevelFilter !== "all" && !keywordHasLogLevel(kw, state.logLevelFilter)) {
                state.logLevelFilter = "all";
              }
            }
            if (externalData && state.selectedTest && !state.selectedTest.logsLoaded) {
              ensureTestLogsLoaded(state.selectedTest).catch(() => {});
            }
            render();
          }
        });
      });
      // Show all / Clear all logs toggle
      document.getElementById("show-all-logs")?.addEventListener("click", () => {
        if (state.logsCleared) {
          state.logsCleared = false;
        } else if (state.selectedKeyword) {
          state.selectedKeyword = null;
        } else {
          state.logsCleared = true;
        }
        render();
      });
      // Log level filter
      document.querySelectorAll(".log-filter-all, .log-filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.logLevelFilter = btn.dataset.level || "all";
          render();
        });
      });
      // Copy single log message (button shown on hover)
      document.querySelectorAll(".log-entry-copy").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const entry = btn.closest(".log-entry");
          const msgEl = entry?.querySelector(".log-message");
          if (msgEl) {
            navigator.clipboard.writeText(msgEl.textContent).then(() => {
              const orig = btn.innerHTML;
              btn.innerHTML = icons.check;
              btn.setAttribute("title", "Copied");
              setTimeout(() => {
                btn.innerHTML = orig;
                btn.setAttribute("title", "Copy message");
              }, 1500);
            });
          }
        });
      });
      // Images in log messages: stop propagation so clicking an image in a
      // clickable log entry doesn't also trigger keyword expansion.
      // Opening in a new tab is handled by the <a target="_blank"> wrapper
      // that renderMessageBody injects around every <img> at render time.
      document.querySelectorAll(".log-message img").forEach(img => {
        img.addEventListener("click", (e) => {
          e.stopPropagation();
        });
      });
      // Test tree: Expand all / Collapse all
      document.getElementById("test-tree-expand-collapse-btn")?.addEventListener("click", () => {
        if (!reportData.rootSuite) return;
        const expandableIds = getExpandableSuiteIds(reportData.rootSuite);
        const allExpanded = expandableIds.length > 0 && expandableIds.every(id => state.expandedSuites.has(id));
        if (allExpanded) {
          expandableIds.forEach(id => state.expandedSuites.delete(id));
        } else {
          expandableIds.forEach(id => state.expandedSuites.add(id));
        }
        render();
      });
      // Keyword panel: Expand all / Collapse all
      document.getElementById("keyword-expand-collapse-btn")?.addEventListener("click", () => {
        const keywordsInOrder = getCurrentKeywordsInOrder();
        if (keywordsInOrder.length === 0) return;
        const expandableIds = getExpandableKeywordIds(keywordsInOrder);
        const allExpanded = expandableIds.length > 0 && expandableIds.every(id => state.expandedKeywords.has(id));
        if (allExpanded) {
          expandableIds.forEach(id => state.expandedKeywords.delete(id));
        } else {
          expandableIds.forEach(id => state.expandedKeywords.add(id));
        }
        render();
      });
      // Click log entry to expand and select the keyword it belongs to
      document.querySelectorAll(".log-entry[data-keyword-id]").forEach(el => {
        el.addEventListener("click", () => {
          const kwId = el.dataset.keywordId;
          const keywordsInOrder = getCurrentKeywordsInOrder();
          const kw = findKeywordById(keywordsInOrder, kwId);
          if (kw) {
            state.selectedKeyword = kw;
            state.logsCleared = false;
            state.expandedKeywords.add(kw.id);
            if (state.logLevelFilter !== "all" && !keywordHasLogLevel(kw, state.logLevelFilter)) {
              state.logLevelFilter = "all";
            }
            const path = getKeywordPath(keywordsInOrder, kwId);
            if (path) path.forEach(id => state.expandedKeywords.add(id));
            render();
          }
        });
      });
      // Copy error
      document.getElementById("copy-error")?.addEventListener("click", async () => {
        if (state.selectedTest?.message) {
          await navigator.clipboard.writeText(state.selectedTest.message);
          const btn = document.getElementById("copy-error");
          btn.innerHTML = `${icons.check} Copied`;
          setTimeout(() => {
            btn.innerHTML = `${icons.copy} Copy`;
          }, 2000);
        }
      });
      // Copy warnings and errors
      document.getElementById("copy-warnings")?.addEventListener("click", async () => {
        if (state.selectedTest?.suiteErrors?.length) {
          const text = state.selectedTest.suiteErrors
            .map(e => `${(e.level || "WARN")} ${e.text || ""}`.trim())
            .join("\n");
          await navigator.clipboard.writeText(text);
          const btn = document.getElementById("copy-warnings");
          btn.innerHTML = `${icons.check} Copied`;
          setTimeout(() => {
            btn.innerHTML = `${icons.copy} Copy`;
          }, 2000);
        }
      });
      // Resize sidebar (drag separator between sidebar and main)
      const resizeSidebarEl = document.getElementById("resize-sidebar");
      if (resizeSidebarEl) {
        resizeSidebarEl.addEventListener("mousedown", (e) => {
          e.preventDefault();
          const startX = e.clientX;
          const startW = state.sidebarWidth;
          resizeSidebarEl.classList.add("resizing");
          const sidebar = document.getElementById("sidebar");
          const toggleBtn = document.getElementById("sidebar-toggle");
          if (sidebar) sidebar.classList.add("resizing");
          if (toggleBtn) toggleBtn.classList.add("resizing");
          const onMove = (e2) => {
            const dx = e2.clientX - startX;
            let w = Math.round(startW + dx);
            w = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, w));
            const sidebarEl = document.getElementById("sidebar");
            const toggle = document.getElementById("sidebar-toggle");
            if (sidebarEl) sidebarEl.style.width = w + "px";
            if (toggle) toggle.style.left = w + "px";
          };
          const onUp = () => {
            const sidebarEl = document.getElementById("sidebar");
            const w = sidebarEl ? parseInt(sidebarEl.style.width, 10) : state.sidebarWidth;
            state.sidebarWidth = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, w));
            try { localStorage.setItem("reportlens-sidebar-width", String(state.sidebarWidth)); } catch (_) {}
            if (sidebar) sidebar.classList.remove("resizing");
            if (toggleBtn) toggleBtn.classList.remove("resizing");
            resizeSidebarEl.classList.remove("resizing");
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
          };
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      }
      // Resize detail panels (drag separator between Keyword Execution and Logs)
      const resizePanelsEl = document.getElementById("resize-panels");
      if (resizePanelsEl) {
        resizePanelsEl.addEventListener("mousedown", (e) => {
          e.preventDefault();
          const container = resizePanelsEl.parentElement;
          if (!container) return;
          const startX = e.clientX;
          const startSplit = state.panelSplit;
          const handleW = 6;
          resizePanelsEl.classList.add("resizing");
          const onMove = (e2) => {
            const rect = container.getBoundingClientRect();
            const total = rect.width - handleW;
            if (total <= 0) return;
            const x = e2.clientX - rect.left;
            let ratio = (x - handleW / 2) / total;
            ratio = Math.max(PANEL_MIN_RATIO, Math.min(PANEL_MAX_RATIO, ratio));
            const leftPanel = document.getElementById("panel-keywords");
            if (leftPanel) leftPanel.style.width = "calc(" + (ratio * 100) + "% - 3px)";
          };
          const onUp = () => {
            const leftPanel = document.getElementById("panel-keywords");
            const rect = container.getBoundingClientRect();
            const handleW2 = 6;
            const total = rect.width - handleW2;
            const leftW = leftPanel ? leftPanel.getBoundingClientRect().width : 0;
            let ratio = total > 0 ? (leftW + 3) / (rect.width - 3) : state.panelSplit;
            ratio = Math.max(PANEL_MIN_RATIO, Math.min(PANEL_MAX_RATIO, ratio));
            state.panelSplit = ratio;
            try { localStorage.setItem("reportlens-panel-split", String(ratio)); } catch (_) {}
            resizePanelsEl.classList.remove("resizing");
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
          };
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      }
    }
    // ========== Deep link: #test=<id> ==========
    async function applyDeepLink() {
      let appliedDeepLink = false;
      const hashMatch = /^#?test=(.+)$/.exec(window.location.hash || "");
      const hashTestId = hashMatch ? decodeURIComponent(hashMatch[1].replace(/^#/, "").trim()) : null;
      if (hashTestId && reportData?.rootSuite) {
        let test = null;
        if (externalData) {
          const suiteId = dataStore.testToSuite.get(hashTestId);
          if (suiteId) await ensureSuiteLoaded(suiteId);
          test = await ensureTestLoaded(hashTestId);
        } else {
          test = getAllTests(reportData.rootSuite).find(t => t.id === hashTestId);
        }
        if (test) {
          const path = getSuitePathToTest(reportData.rootSuite, hashTestId);
          if (path) path.forEach(id => state.expandedSuites.add(id));
          state.selectedTest = test;
          state.selectedKeyword = null;
          state.logsCleared = false;
          const kws = Array.isArray(test.keywords) ? test.keywords : [];
          if (kws.length === 1 && Array.isArray(kws[0].keywords) && kws[0].keywords.length > 0) {
            state.expandedKeywords.add(kws[0].id);
          }
          appliedDeepLink = true;
        }
      }
      return appliedDeepLink;
    }
    async function boot() {
      if (handleFileProtocolWarning()) {
        render();
        return;
      }
      if (externalData) {
        await loadExternalData();
      }
      if (reportData?.rootSuite) {
        applyTriageDefaults(reportData.rootSuite);
        initializeExpandedSuites(reportData.rootSuite);
      }
      const appliedDeepLink = await applyDeepLink();
      if (!appliedDeepLink) {
        if (externalData && reportData?.rootSuite) {
          const failedSuiteIds = getFailedSuiteIds(reportData.rootSuite);
          const leafFailedIds = failedSuiteIds.filter(id => {
            const suite = dataStore.suiteMap.get(id);
            return suite && Array.isArray(suite.testIds) && suite.testIds.length > 0;
          });
          const failedCount = countFailedTestsQuick(reportData.rootSuite);
          const loadLimit = failedCount > LARGE_FAIL_THRESHOLD
            ? BOOT_LOAD_FAILED_SUITES_LARGE
            : BOOT_LOAD_FAILED_SUITES_MAX;
          const suitesToLoad = leafFailedIds.slice(0, Math.max(1, loadLimit));
          for (const suiteId of suitesToLoad) {
            const path = getSuitePathToId(reportData.rootSuite, suiteId);
            if (path) path.forEach(pathId => state.expandedSuites.add(pathId));
            await ensureSuiteLoaded(suiteId);
          }
          const primaryFailedSuiteId = suitesToLoad[0];
          if (primaryFailedSuiteId) {
            const suite = dataStore.suiteMap.get(primaryFailedSuiteId);
            const failedTest = suite?.tests?.find(t => (t.status || "").toUpperCase() === "FAIL");
            const fallbackTestId = failedTest?.id || suite?.tests?.[0]?.id || suite?.testIds?.[0];
            if (fallbackTestId) {
              const loaded = await ensureTestLoaded(fallbackTestId);
              if (loaded) state.selectedTest = loaded;
            }
          }
        } else {
          const failedTests = reportData?.rootSuite ? getFailedTests(reportData.rootSuite) : [];
          if (failedTests.length > 0) {
            state.selectedTest = failedTests[0];
          }
        }
      }
      if (!appliedDeepLink && !state.selectedTest && reportData?.rootSuite) {
        const failedTests = getFailedTests(reportData.rootSuite);
        if (failedTests.length > 0) {
          const firstFailed = failedTests[0];
          if (externalData) {
            const suiteId = dataStore.testToSuite.get(firstFailed.id);
            if (suiteId) {
              const path = getSuitePathToId(reportData.rootSuite, suiteId);
              if (path) path.forEach(pathId => state.expandedSuites.add(pathId));
              await ensureSuiteLoaded(suiteId);
            }
            const loaded = await ensureTestLoaded(firstFailed.id);
            if (loaded) state.selectedTest = loaded;
          } else {
            state.selectedTest = firstFailed;
          }
        }
      }
      render();
      if (appliedDeepLink && state.selectedTest) {
        const el = document.querySelector(`[data-test-id="${state.selectedTest.id}"]`);
        if (el) el.scrollIntoView({ behavior: "auto", block: "nearest" });
      }
    }
    boot();
  </script>
</body>
</html>
